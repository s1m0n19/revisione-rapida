esercizio: "Verifica 1 - Parte 1 - Giorni di punta"
parti:
  - nome: "Parte 1 - Giorni di punta"
    punti_totali: 25
    criteri:
      - nome: "Correttezza - individuazione giorni di punta ed eccedenza"
        peso_punti: 18
        tipo: oggettivo
        fonte_test: sostituzione_dati
        target:
          tipo_c: "int[7]"
        soluzione_riferimento: "soluzioni.parte1"
        dataset:
          - nome: "tutti sotto soglia"
            valori: [10, 20, 15, 30, 25, 18, 22]
          - nome: "caso limite esatto"
            valori: [40, 40, 41, 39, 40, 45, 40]

      - nome: "Uso corretto di array e cicli"
        peso_punti: 4
        tipo: llm
        livelli:
          - {punti: 4, descrizione: "Ciclo unico, indicizzazione corretta, nessuna ripetizione inutile"}
          - {punti: 2, descrizione: "Funziona ma con logica ridondante o poco chiara"}
          - {punti: 0, descrizione: "Uso scorretto o confuso dell'array"}

      - nome: "Leggibilità e commenti"
        peso_punti: 3
        tipo: llm
        livelli:
          - {punti: 3, descrizione: "Commenti utili, nomi variabili chiari"}
          - {punti: 1, descrizione: "Commenti minimi o nomi poco chiari"}
          - {punti: 0, descrizione: "Assenti o fuorvianti"}